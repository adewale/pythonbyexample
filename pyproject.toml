[project]
name = "pythonbyexample"
version = "0.1.0"
description = "Python By Example on Cloudflare Python Workers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
]

[dependency-groups]
workers = [
    "workers-py",
    "workers-runtime-sdk",
]
dev = [
    "pillow>=11.3,<12",
    "ruff==0.16.0",
]

[tool.ruff]
required-version = "==0.16.0"
line-length = 100
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Observability helpers deliberately catch host-runtime failures so telemetry
# can never change an application's result.
"src/observability.py" = ["BLE001", "S110", "S112"]
