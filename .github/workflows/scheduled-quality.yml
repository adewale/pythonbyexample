name: Scheduled quality

# Runs the editorial quality gates weekly on the default branch, with no code
# change needed. `make check-waiver-expiry` fails while a quality waiver has 30
# days or fewer left, so an expiry is noticed here (GitHub emails the failure)
# a month before `make verify` would start failing every pull request.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Quality gates
        run: make quality-checks
      - name: Fail 30 days before a quality waiver expires
        run: make check-waiver-expiry
